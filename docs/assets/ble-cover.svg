<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">ESP32 Master-Slave BLE</title>
<desc id="desc">One Master controls two peripherals over BLE. Three hardware columns describe the pushbutton input and two LED outputs. The original FreeRTOS Master is hardware-tested.</desc>
<rect width="1280" height="640" rx="12" fill="#101113"/>
<path d="M30 71H1250M30 558H1250" stroke="#333236"/>
<g font-family="Bahnschrift,Arial,sans-serif">
<g transform="translate(34 26)" fill="none" stroke="#e6a17c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="30" height="30" rx="7" stroke="#775341"/><path d="m9 9 13 12-7 6V3l7 6L9 21"/>
</g>
<text x="78" y="47" fill="#f1eee7" font-size="19" font-weight="600">ESP32 / Master-Slave BLE</text>
<rect x="1084" y="29" width="160" height="25" rx="12" fill="#26201d"/>
<text x="1164" y="46" fill="#e6a17c" font-size="12" text-anchor="middle" letter-spacing="1">BCA188 / LAB 7</text>
<text x="42" y="175" fill="#f1eee7" font-size="63" font-weight="700" letter-spacing="-2">One master.</text>
<text x="42" y="248" fill="#f1eee7" font-size="63" font-weight="700" letter-spacing="-2">Two peripherals.</text>
<text x="42" y="321" fill="#e6a17c" font-size="63" font-weight="700" letter-spacing="-2">Connected by BLE.</text>
<g fill="#ada8a1" font-size="20">
<text x="46" y="370">Button-controlled LEDs, independent</text>
<text x="46" y="400">FreeRTOS workers, and automatic recovery.</text>
</g>
<g font-size="14" text-anchor="middle">
<rect x="46" y="450" width="69" height="29" rx="4" fill="#252120" stroke="#554136"/><text x="80" y="470" fill="#e6a17c">C++</text>
<rect x="125" y="450" width="91" height="29" rx="4" fill="#1c1c1f" stroke="#333236"/><text x="170" y="470" fill="#c2bdb7">Arduino</text>
<rect x="226" y="450" width="107" height="29" rx="4" fill="#1c1c1f" stroke="#333236"/><text x="279" y="470" fill="#c2bdb7">FreeRTOS</text>
</g>
